<!doctype html>
<!--
  Orthogonal intents (maintained 2026-09-06; original user request: 新增
  ./opentray 官网站点):
  1. No-flash theme bootstrap before first paint: read localStorage `theme`
     (light|dark|system), set the `.dark` class + colorScheme on <html>.
  2. JS liveness flag (`html.js`): card-grid's entrance hidden state keys on
     it, so prerendered and no-JS output stays fully visible.
  3. favicon + theme-color carry the project icon hex #00a6f4 (openspec
     change 2026-09-06-add-website; deliberate divergence from the skill's
     #000000 dark-canvas rule — recorded in NOTES.md).
  4. Locale surface (2026-09-06): lang is a %lang% placeholder resolved
     per request by src/hooks.server.ts (en at the root, zh under /zh/),
     so each prerendered page ships its own <html lang>.
  5. Locale negotiation (2026-09-06): before first paint, a zh-preferring
     visitor on the DEFAULT (en) surface is sent to its /zh/ mirror —
     explicit persisted choice (localStorage `lang`, written by the
     switcher) first, else the first navigator.languages match. Detection
     only ever happens on the default surface; the non-default surface
     never redirects (loop-proof by construction — see the script).
-->

<html lang="%lang%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00a6f4" />
    <link rel="icon" href="%sveltekit.assets%/icon.svg" />
    <link rel="icon" type="image/png" href="%sveltekit.assets%/opentray-logo.png" />
    <script>
      (() => {
        // Locale negotiation, BEFORE first paint (openspec change
        // 2026-09-06-locale-negotiation): a zh-preferring visitor on the
        // default (en) surface is sent to the same page under /zh/ (path +
        // hash preserved) via location.replace (no history entry).
        // Precedence: explicit persisted choice (localStorage `lang`,
        // written by the layout's switcher) > first navigator.languages
        // match on the primary subtag (zh-CN/zh-Hans → zh).
        // Loop-proof by construction: the script only redirects AWAY from
        // the default surface, the target always carries the /zh/ prefix
        // (so the condition can never hold again), and nothing ever
        // redirects back from /zh/.
        const siteBase = '%site_base%'; // baked per build by hooks.server.ts (same env law as kit.paths.base)
        const path = window.location.pathname;
        const route =
          siteBase !== '' && `${path}/`.startsWith(`${siteBase}/`)
            ? path.slice(siteBase.length) || '/'
            : path;
        if (/^\/zh(?:\/|$)/.test(route)) return; // already on the zh surface — never redirect
        const negotiate = () => {
          try {
            const stored = window.localStorage.getItem('lang');
            if (stored === 'zh' || stored === 'en') return stored; // explicit choice wins
          } catch {
            /* storage unavailable → fall through to detection */
          }
          const langs = navigator.languages ?? (navigator.language ? [navigator.language] : []);
          for (const tag of langs) {
            const primary = String(tag).split('-')[0].toLowerCase();
            if (primary === 'zh') return 'zh';
            if (primary === 'en') return 'en'; // default already matches — first match wins
          }
          return null;
        };
        if (negotiate() === 'zh') {
          window.location.replace(
            `${siteBase}/zh${route === '/' ? '/' : route}${window.location.hash}`,
          );
        }
      })();
    </script>
    <script>
      (() => {
        // No-flash theme bootstrap + JS liveness flag (reveal/card-grid
        // styles key off html.js so prerendered and no-JS output stays
        // fully visible).
        const root = document.documentElement;
        root.classList.add('js');
        const isTheme = (value) => value === 'light' || value === 'dark' || value === 'system';
        let theme = 'system';
        try {
          const stored = window.localStorage.getItem('theme');
          if (isTheme(stored)) theme = stored;
        } catch {
          theme = 'system';
        }
        const prefersDark =
          typeof window.matchMedia === 'function' &&
          window.matchMedia('(prefers-color-scheme: dark)').matches;
        root.classList.toggle('dark', theme === 'dark' || (theme === 'system' && prefersDark));
        root.style.colorScheme = root.classList.contains('dark') ? 'dark' : 'light';
      })();
    </script>
    %sveltekit.head%
  </head>
  <body>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
