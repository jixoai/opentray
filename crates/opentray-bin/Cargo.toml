[package]
name = "opentray-bin"
description = "OpenTray broker CLI composition layer."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "opentray"
path = "src/main.rs"

[dependencies]
libloading.workspace = true
opentray-core.workspace = true
opentray-spec.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
opentray-backend-tray-icon.workspace = true
tray-icon.workspace = true
winit = "0.30"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes"] }

[build-dependencies]
# RT_MANIFEST wiring (add-ext-dialog task 3.3b). winresource is the actively
# maintained successor of the unmaintained `winres` and embeds resources with
# a pure-Rust COFF writer, so no external rc.exe/windres is required on any
# build host. See build.rs for the full selection rationale.
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSProcessInfo",
  "NSString",
] }

[target.'cfg(target_os = "linux")'.dependencies]
opentray-backend-ksni.workspace = true
