[package]
name = "opentray-ext-webview"
description = "OpenTray WebView dynamic extension ABI provider."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
opentray-spec.workspace = true
serde.workspace = true
serde_json.workspace = true
url = "2.5.7"

[target.'cfg(target_os = "macos")'.dependencies]
base64 = "0.22.1"
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSColor", "NSEvent", "NSGraphics", "NSGraphicsContext", "NSImage", "NSMenu", "NSMenuItem", "NSResponder", "NSScreen", "NSView", "NSWindow", "block2", "objc2-core-foundation", "objc2-quartz-core"] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSData", "NSDictionary", "NSGeometry", "NSString", "NSURL"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CALayer", "objc2-core-foundation"] }
png = "0.17.16"
raw-window-handle = { version = "0.6.2", features = ["std"] }
window-vibrancy = "0.7.1"
wry = { version = "0.55.1", default-features = false, features = ["os-webview", "transparent"] }

[target.'cfg(target_os = "windows")'.dependencies]
base64 = "0.22.1"
png = "0.17.16"
raw-window-handle = { version = "0.6.2", features = ["std"] }
softbuffer = { version = "0.4.8", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
window-vibrancy = "0.7.1"
wry = { version = "0.55.1", default-features = false, features = ["os-webview", "transparent"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
tao = { version = "0.35.3", default-features = false, features = ["rwh_06"] }
