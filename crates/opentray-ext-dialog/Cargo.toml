[package]
name = "opentray-ext-dialog"
description = "OpenTray native dialog dynamic extension ABI provider."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
opentray-spec.workspace = true
serde.workspace = true
serde_json.workspace = true

# macOS versions are aligned with opentray-ext-webview's declarations
# (objc2-app-kit 0.3.x / objc2 0.6.x / dispatch2 0.3.x).
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = [
    "NSAlert",
    "NSApplication",
    "NSButton",
    "NSEvent",
    "NSGraphicsContext",
    "NSOpenPanel",
    "NSPanel",
    "NSResponder",
    "NSSavePanel",
    "NSWindow",
    "block2",
    "objc2-uniform-type-identifiers",
] }
objc2-foundation = { version = "0.3.2", features = [
    "NSArray",
    "NSDate",
    "NSGeometry",
    "NSObjCRuntime",
    "NSString",
    "NSURL",
] }
objc2-uniform-type-identifiers = { version = "0.3.2", default-features = false, features = [
    "UTCoreTypes",
    "UTType",
] }

# Windows versions are aligned with opentray-ext-webview's declarations
# (windows-sys/windows 0.61.x). TaskDialogIndirect is NEVER a static import
# (a manifest-less host would fail to load the DLL against comctl32 v5);
# only runtime-resolved entry points and the COM dialog family link.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
