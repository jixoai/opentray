[package]
name = "opentray-backend-tray-icon"
description = "OpenTray macOS and Windows backend atom over tauri-apps tray-icon."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
opentray-core.workspace = true
opentray-spec.workspace = true
png = "0.17.16"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSButton", "NSCell", "NSControl", "NSEvent", "NSResponder", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry", "NSThread"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dev-dependencies]
tao = { version = "0.35.3", default-features = false, features = ["rwh_06"] }
winit = "0.30"
wry = { version = "0.55.1", default-features = false, features = ["os-webview"] }
