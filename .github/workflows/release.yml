# Orthogonal intents (maintained 2026-09-06; original user request 2026-09-06
# Asia/Shanghai: 把没有好好配置 github-releases 的仓库 CI/CD 升级为自动发布,
# 让 jixoai.com 能显示版本号):
# 1. Publish the fixed OpenTray package family via changesets (existing law)
#    and cut the matching GitHub Release right after the stable publish —
#    tag follows the `changeset tag` convention, notes come from the
#    changesets-generated changelog sections (scripts/binaries/cut-github-release.ts).
# 2. workflow_dispatch `release-current=true` is the bootstrap guide mode:
#    no version bump, no publish — it only cuts the GitHub Release for the
#    CURRENT published version; the heavy build/publish chain is skipped
#    for that dispatch.
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options:
          - stable
          - alpha
        default: stable
      release-current:
        description: Bootstrap — cut the GitHub Release for the CURRENT published version (no bump, no publish)
        type: boolean
        default: false

concurrency:
  # Include the source SHA so a jobless queued run cannot permanently block
  # later release attempts on the same branch after an Actions outage.
  group: release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  OPENTRAY_BUILD_IDENTITY: "github:${{ github.sha }}"

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  plan-native:
    name: Plan native release build
    # Bootstrap dispatches never run the build/publish chain — the whole
    # chain hangs off this job and skips together.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs['release-current'] != true }}
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      publish-enabled: ${{ steps.plan.outputs.publish-enabled }}
      matrix: ${{ steps.plan.outputs.matrix }}
      packed-consumer-enabled: ${{ steps.plan.outputs.packed-consumer-enabled }}
      packed-consumer-matrix: ${{ steps.plan.outputs.packed-consumer-matrix }}
      stage-plan: ${{ steps.plan.outputs.stage-plan }}
      validate-package-dirs: ${{ steps.plan.outputs.validate-package-dirs }}
      embedded-packages: ${{ steps.plan.outputs.embedded-packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Resolve native release plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          plan_json="$(bun run scripts/binaries/release-plan.ts --root "$PWD")"
          printf '%s\n' "$plan_json" > release-native-plan.json
          cat release-native-plan.json

          python3 - <<'PY'
          import json
          import os

          with open("release-native-plan.json", "r", encoding="utf-8") as handle:
              plan = json.load(handle)

          enabled = "true" if plan.get("enabled") else "false"
          publish_enabled = "true" if plan.get("publishEnabled") else "false"
          matrix = json.dumps({"include": plan.get("jobs", [])})
          # Packed-consumer coverage is the webview closure fixture
          # (verify-packed-consumer packs the ext-webview facade plus the
          # split platform runtime/extension packages). Embedded facades
          # (dialog, sound) have no split platform packages, so their jobs are
          # intentionally NOT added to this matrix: their packed-consumer
          # equivalent is the real-pack + unpack identity evidence
          # (check:pack-size + verify-embedded-pack-evidence.ts), enforced
          # wherever any embedded package is staged (add-ext-dialog batch D,
          # tasks 5.1/5.2; add-ext-sound task 5.1 generalized the gate).
          packed_consumer_jobs = [
              job for job in plan.get("jobs", [])
              if "webview" in str(job.get("componentsCsv", "")).split(",")
          ]
          packed_consumer_enabled = "true" if packed_consumer_jobs else "false"
          packed_consumer_matrix = json.dumps({"include": packed_consumer_jobs})
          stage_plan = json.dumps(plan.get("stageEntries", []))
          validate_package_dirs = json.dumps(plan.get("validatePackageDirs", []))
          # Embedded facade packages staged by this plan (dialog, sound, ...):
          # derived by the planner from the staged artifact kinds, never
          # hardcoded per extension name.
          embedded_packages = json.dumps(
              sorted(set(plan.get("embeddedPackages", [])))
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"enabled={enabled}\n")
              handle.write(f"publish-enabled={publish_enabled}\n")
              handle.write(f"matrix={matrix}\n")
              handle.write(f"packed-consumer-enabled={packed_consumer_enabled}\n")
              handle.write(f"packed-consumer-matrix={packed_consumer_matrix}\n")
              handle.write(f"stage-plan={stage_plan}\n")
              handle.write(f"validate-package-dirs={validate_package_dirs}\n")
              handle.write(f"embedded-packages={embedded_packages}\n")
          PY

  prepare-release:
    name: Prepare versioned release source
    needs: plan-native
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      has-changesets: ${{ steps.pending.outputs.has-changesets }}
      source-ref: ${{ steps.source.outputs.source-ref }}
      apply-patch: ${{ steps.source.outputs.apply-patch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release channel
        id: channel
        shell: bash
        run: |
          channel=stable
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.channel }}" == "alpha" ]]; then
            channel=alpha
          fi
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Detect pending changesets
        id: pending
        shell: bash
        run: |
          if find .changeset -maxdepth 1 -type f -name "*.md" ! -name "README.md" | grep -q .; then
            echo "has-changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-changesets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize release source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_ref="${{ github.sha }}"
          apply_patch=false

          if [[ "${{ steps.pending.outputs.has-changesets }}" == "true" ]]; then
            if [[ "${{ steps.channel.outputs.channel }}" == "alpha" ]]; then
              pnpm run version-packages:alpha
              git diff --binary -- . > release-source.patch
              apply_patch=true
            else
              pnpm run version-packages
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add .changeset packages package.json pnpm-lock.yaml
              git commit -m "chore: version packages"
              git push
              source_ref="$(git rev-parse HEAD)"
            fi
          fi

          echo "source-ref=${source_ref}" >> "$GITHUB_OUTPUT"
          echo "apply-patch=${apply_patch}" >> "$GITHUB_OUTPUT"

      - name: Upload alpha release source patch
        if: steps.source.outputs.apply-patch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-source-${{ github.run_id }}
          path: release-source.patch
          if-no-files-found: error

  native-artifacts:
    name: Native artifacts (${{ matrix.target }} / ${{ matrix.componentsCsv }})
    needs:
      - plan-native
      - prepare-release
    if: needs.plan-native.outputs.enabled == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.jobTimeoutMinutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-native.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.source-ref }}

      - name: Download alpha release source patch
        if: needs.prepare-release.outputs.apply-patch == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-source-${{ github.run_id }}
          path: release-source

      - name: Apply alpha release source patch
        if: needs.prepare-release.outputs.apply-patch == 'true'
        shell: bash
        run: git apply release-source/release-source.patch

      - name: Setup Node.js
        if: startsWith(matrix.target, 'darwin-')
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Build native artifacts
        shell: bash
        run: |
          set -euo pipefail
          bun run scripts/binaries/build-native-job.ts \
            --root "$PWD" \
            --target "${{ matrix.target }}" \
            --components "${{ matrix.componentsCsv }}" \
            --output-dir native-artifacts

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}
          path: native-artifacts/*
          if-no-files-found: error

  packed-consumer:
    name: Packed consumer (${{ matrix.target }})
    needs:
      - plan-native
      - prepare-release
      - native-artifacts
    if: ${{ needs.plan-native.outputs.packed-consumer-enabled == 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-native.outputs.packed-consumer-matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.source-ref }}

      - name: Download alpha release source patch
        if: needs.prepare-release.outputs.apply-patch == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-source-${{ github.run_id }}
          path: release-source

      - name: Apply alpha release source patch
        if: needs.prepare-release.outputs.apply-patch == 'true'
        shell: bash
        run: git apply release-source/release-source.patch

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publish artifacts
        run: pnpm run build

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-artifacts

      - name: Stage native artifacts into npm packages
        shell: bash
        run: |
          set -euo pipefail
          bun run scripts/binaries/stage-release-artifacts.ts \
            --root "$PWD" \
            --artifact-root native-artifacts \
            --stage-plan-json '${{ needs.plan-native.outputs.stage-plan }}'

      - name: Validate native package contents
        shell: bash
        run: |
          set -euo pipefail
          bun run scripts/binaries/validate-package-dirs.ts \
            --package-dirs-json '${{ needs.plan-native.outputs.validate-package-dirs }}'

      - name: Verify packed pnpm consumer
        run: pnpm run verify:packed-consumer -- --package-manager pnpm --target "${{ matrix.target }}"

      - name: Verify packed npm consumer
        run: pnpm run verify:packed-consumer -- --package-manager npm --target "${{ matrix.target }}"

  release:
    name: Release packages
    needs:
      - plan-native
      - prepare-release
      - native-artifacts
      - packed-consumer
    if: ${{ always() && needs.plan-native.result == 'success' && needs.prepare-release.result == 'success' && needs.native-artifacts.result != 'failure' && needs.native-artifacts.result != 'cancelled' && (needs.packed-consumer.result == 'success' || needs.packed-consumer.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.source-ref }}

      - name: Download alpha release source patch
        if: needs.prepare-release.outputs.apply-patch == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-source-${{ github.run_id }}
          path: release-source

      - name: Apply alpha release source patch
        if: needs.prepare-release.outputs.apply-patch == 'true'
        shell: bash
        run: git apply release-source/release-source.patch

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install npm with trusted publishing support
        run: npm install -g "npm@^11.10.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install CJK-capable fonts
        # The icon kernel's glyph ladder renders CJK application names through
        # discovered system fonts; bare ubuntu runners ship none.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Build publish artifacts
        run: pnpm run build

      - name: Verify
        run: pnpm run verify

      - name: Download native artifacts
        if: needs.plan-native.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-artifacts

      - name: Stage native artifacts into npm packages
        if: needs.plan-native.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bun run scripts/binaries/stage-release-artifacts.ts \
            --root "$PWD" \
            --artifact-root native-artifacts \
            --stage-plan-json '${{ needs.plan-native.outputs.stage-plan }}'

      - name: Validate native package contents
        if: needs.plan-native.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bun run scripts/binaries/validate-package-dirs.ts \
            --package-dirs-json '${{ needs.plan-native.outputs.validate-package-dirs }}'

      # Real-pack evidence for embedded platform-binary facades (Owner ruling
      # 2026-09-16; add-ext-dialog section 6.3): dry-run output is NOT release
      # evidence. Runs as an explicit CI step because the generic `verify`
      # aggregator executes before native staging populates platforms/.
      - name: Pack-size gate (real npm pack) for embedded packages
        if: needs.plan-native.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          pnpm run check:pack-size 2>&1 | tee embedded-pack-size-receipt.txt

      - name: Embedded pack identity evidence (unpack and re-hash per target)
        if: needs.plan-native.outputs.enabled == 'true' && needs.plan-native.outputs.embedded-packages != '[]'
        shell: bash
        env:
          EMBEDDED_PACKAGES: ${{ needs.plan-native.outputs.embedded-packages }}
        run: |
          set -euo pipefail
          for package_dir in $(printf '%s' "$EMBEDDED_PACKAGES" | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)))'); do
            echo "::group::Embedded pack identity: ${package_dir}"
            bun run scripts/binaries/verify-embedded-pack-evidence.ts \
              --root "$PWD" \
              --package "$package_dir" 2>&1 | tee "embedded-pack-identity-$(basename "$package_dir").txt"
            echo "::endgroup::"
          done

      - name: Upload embedded pack evidence
        if: needs.plan-native.outputs.enabled == 'true' && needs.plan-native.outputs.embedded-packages != '[]'
        uses: actions/upload-artifact@v4
        with:
          name: embedded-pack-evidence
          path: |
            embedded-pack-size-receipt.txt
            embedded-pack-identity-*.txt
          if-no-files-found: error

      - name: Publish packages
        if: needs.plan-native.outputs.publish-enabled == 'true' && needs.prepare-release.outputs.channel == 'stable'
        # Trusted publishing (OIDC) is the release auth path. The npm-release
        # environment injects a bypass-2FA publishing token through several
        # channels (NODE_AUTH_TOKEN via setup-node's npmrc template, and
        # possibly NPM_CONFIG_* env); npm's 2026-09 restriction stops such
        # tokens from creating NEW package names (E404 on first release),
        # and ANY residual token config shadows npm's native OIDC exchange.
        # The publish child gets a clean npmrc and every token channel
        # stripped: npm >=11.5 then authenticates each publish through the
        # package's registered trusted publisher (id-token: write, changesets
        # provenance: true). The claim dump below is release diagnostics: it
        # prints the decoded OIDC token claims (never the token itself) so a
        # rejected exchange can be compared against the npm-side registration.
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::warning::OIDC minting endpoint NOT present — id-token: write did not reach this job"
          else
            curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm" \
              | python3 -c "import json,sys,base64; t=json.load(sys.stdin)['value']; p=t.split('.')[1]; p+='='*(-len(p)%4); print('OIDC claims:', json.dumps(json.loads(base64.urlsafe_b64decode(p)), indent=2, sort_keys=True))"
          fi
          printf 'registry=https://registry.npmjs.org/\n' > /tmp/publish-clean.npmrc
          # Direct changeset binary (bypasses `pnpm run`'s npm_config_* env
          # injection, which shadowed npm's OIDC detection).
          env -u NODE_AUTH_TOKEN -u NPM_TOKEN -u NPM_CONFIG__AUTH_TOKEN \
            NPM_CONFIG_USERCONFIG=/tmp/publish-clean.npmrc \
            ./node_modules/.bin/changeset publish

      - name: Publish alpha packages
        if: needs.prepare-release.outputs.has-changesets == 'true' && needs.prepare-release.outputs.channel == 'alpha'
        run: |
          printf 'registry=https://registry.npmjs.org/\n' > /tmp/publish-clean.npmrc
          env -u NODE_AUTH_TOKEN -u NPM_TOKEN -u NPM_CONFIG__AUTH_TOKEN \
            NPM_CONFIG_USERCONFIG=/tmp/publish-clean.npmrc \
            pnpm run release:alpha

      - name: Backfill release tags
        if: needs.plan-native.outputs.publish-enabled == 'true' && needs.prepare-release.outputs.channel == 'stable'
        run: pnpm exec changeset tag

      - name: Push release tags
        if: needs.plan-native.outputs.publish-enabled == 'true' && needs.prepare-release.outputs.channel == 'stable'
        run: git push origin --tags

  github-release:
    name: GitHub Release (published version)
    needs:
      - plan-native
      - prepare-release
      - release
    # Mirror the publish gate: only a successful stable publish cuts a
    # GitHub Release. The tag is already pushed by the release job; the
    # script is idempotent, so re-runs are safe.
    if: ${{ always() && needs.plan-native.outputs.publish-enabled == 'true' && needs.prepare-release.outputs.channel == 'stable' && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.source-ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cut the GitHub Release for the published version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bun run scripts/binaries/cut-github-release.ts --root "$PWD"

  release-current:
    name: Bootstrap GitHub Release (current version)
    # The bootstrap guide mode: no version bump, no publish — only cut the
    # GitHub Release for the CURRENT published version.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs['release-current'] == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Resolve current version and its bump commit
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/cli/package.json').version")"
          target="$(git log -1 --format=%H -S"\"version\": \"${version}\"" -- packages/cli/package.json)"
          if [[ -z "$target" ]]; then
            echo "warning: no version-bump commit found for ${version} — targeting HEAD" >&2
            target="$(git rev-parse HEAD)"
          fi
          {
            echo "version=${version}"
            echo "target=${target}"
          } >> "$GITHUB_OUTPUT"
          echo "version=${version} target=${target}"

      - name: Cut the GitHub Release for the current version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bun run scripts/binaries/cut-github-release.ts \
            --root "$PWD" \
            --version "${{ steps.version.outputs.version }}" \
            --target "${{ steps.version.outputs.target }}"
