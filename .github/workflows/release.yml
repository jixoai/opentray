name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  native-artifacts:
    name: Native artifacts (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
            daemon_artifact: opentray
            webview_artifact: libopentray_ext_webview.dylib
            lynx_artifact: libopentray_ext_lynx.dylib
          - target: darwin-x64
            runner: macos-15-intel
            daemon_artifact: opentray
            webview_artifact: libopentray_ext_webview.dylib
            lynx_artifact: libopentray_ext_lynx.dylib
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            daemon_artifact: opentray
            webview_artifact: libopentray_ext_webview.so
          - target: linux-x64
            runner: ubuntu-24.04
            daemon_artifact: opentray
            webview_artifact: libopentray_ext_webview.so
          - target: windows-arm64
            runner: windows-11-arm
            daemon_artifact: opentray.exe
            webview_artifact: opentray_ext_webview.dll
          - target: windows-x64
            runner: windows-2025
            daemon_artifact: opentray.exe
            webview_artifact: opentray_ext_webview.dll
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Xcode
        if: startsWith(matrix.target, 'darwin-')
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2

      - name: Build native artifacts
        shell: bash
        run: |
          set -euo pipefail
          packages=(-p opentray-bin -p opentray-ext-webview)
          if [[ "${{ matrix.target }}" == darwin-* ]]; then
            packages+=(-p opentray-ext-lynx)
          fi
          cargo build --release "${packages[@]}"
          mkdir -p native-artifacts
          cp "target/release/${{ matrix.daemon_artifact }}" native-artifacts/
          cp "target/release/${{ matrix.webview_artifact }}" native-artifacts/
          if [[ "${{ matrix.target }}" == darwin-* ]]; then
            cp "target/release/${{ matrix.lynx_artifact }}" native-artifacts/
            bash scripts/release/build-lynx-runtime.sh "native-artifacts/LynxExplorer.app.zip"
          fi

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: native-artifacts/*
          if-no-files-found: error

  release:
    name: Release packages
    needs: native-artifacts
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install npm with trusted publishing support
        run: npm install -g "npm@^11.10.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm run verify

      - name: Build publish artifacts
        run: pnpm run build

      - name: Detect pending changesets
        id: pending-changesets
        shell: bash
        run: |
          if find .changeset -maxdepth 1 -type f -name "*.md" ! -name "README.md" | grep -q .; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Version packages
        if: steps.pending-changesets.outputs.has_changesets == 'true'
        run: pnpm run version-packages

      - name: Commit version packages
        if: steps.pending-changesets.outputs.has_changesets == 'true'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No version changes generated."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .changeset packages package.json pnpm-lock.yaml
          git commit -m "chore: version packages"
          git push

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-artifacts

      - name: Stage native artifacts into npm packages
        shell: bash
        run: |
          set -euo pipefail
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 windows-arm64 windows-x64; do
            package_os="${target%-*}"
            arch="${target##*-}"
            if [ "$package_os" = "windows" ]; then
              daemon_artifact="opentray.exe"
              webview_artifact="opentray_ext_webview.dll"
            elif [ "$package_os" = "darwin" ]; then
              daemon_artifact="opentray"
              webview_artifact="libopentray_ext_webview.dylib"
            else
              daemon_artifact="opentray"
              webview_artifact="libopentray_ext_webview.so"
            fi

            bun run scripts/binaries/stage-local.ts \
              --kind daemon \
              --source "native-artifacts/native-${target}/${daemon_artifact}" \
              --package-os "$package_os" \
              --arch "$arch"
            bun run scripts/binaries/stage-local.ts \
              --kind webview \
              --source "native-artifacts/native-${target}/${webview_artifact}" \
              --package-os "$package_os" \
              --arch "$arch"
            if [ "$package_os" = "darwin" ]; then
              bun run scripts/binaries/stage-local.ts \
                --kind lynx \
                --source "native-artifacts/native-${target}/libopentray_ext_lynx.dylib" \
                --package-os "$package_os" \
                --arch "$arch"
              bun run scripts/binaries/stage-local.ts \
                --kind lynx-runtime \
                --source "native-artifacts/native-${target}/LynxExplorer.app.zip" \
                --package-os "$package_os" \
                --arch "$arch"
            fi
          done

      - name: Validate native package contents
        shell: bash
        run: |
          set -euo pipefail
          for package_dir in \
            packages/darwin-arm64 packages/darwin-x64 packages/linux-arm64 packages/linux-x64 packages/windows-arm64 packages/windows-x64 \
            packages/ext-webview-darwin-arm64 packages/ext-webview-darwin-x64 packages/ext-webview-linux-arm64 packages/ext-webview-linux-x64 packages/ext-webview-windows-arm64 packages/ext-webview-windows-x64 \
            packages/ext-lynx-darwin-arm64 packages/ext-lynx-darwin-x64
          do
            npm pack --dry-run --json "./${package_dir}" >/dev/null
          done

      - name: Publish packages
        run: pnpm run release

      - name: Push release tags
        run: git push --follow-tags
