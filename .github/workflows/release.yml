name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options:
          - stable
          - alpha
        default: stable

concurrency:
  # Include the source SHA so a jobless queued run cannot permanently block
  # later release attempts on the same branch after an Actions outage.
  group: release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  LYNX_REF: "3a936299ec1669cfd1f3da71e41240296bc226b3"
  LYNX_XCODE_VERSION: "16.4"

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  plan-native:
    name: Plan native release build
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      publish-enabled: ${{ steps.plan.outputs.publish-enabled }}
      matrix: ${{ steps.plan.outputs.matrix }}
      stage-plan: ${{ steps.plan.outputs.stage-plan }}
      validate-package-dirs: ${{ steps.plan.outputs.validate-package-dirs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Resolve native release plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          plan_json="$(bun run scripts/binaries/release-plan.ts --root "$PWD")"
          printf '%s\n' "$plan_json" > release-native-plan.json
          cat release-native-plan.json

          python3 - <<'PY'
          import json
          import os

          with open("release-native-plan.json", "r", encoding="utf-8") as handle:
              plan = json.load(handle)

          enabled = "true" if plan.get("enabled") else "false"
          publish_enabled = "true" if plan.get("publishEnabled") else "false"
          matrix = json.dumps({"include": plan.get("jobs", [])})
          stage_plan = json.dumps(plan.get("stageEntries", []))
          validate_package_dirs = json.dumps(plan.get("validatePackageDirs", []))

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"enabled={enabled}\n")
              handle.write(f"publish-enabled={publish_enabled}\n")
              handle.write(f"matrix={matrix}\n")
              handle.write(f"stage-plan={stage_plan}\n")
              handle.write(f"validate-package-dirs={validate_package_dirs}\n")
          PY

  native-artifacts:
    name: Native artifacts (${{ matrix.target }} / ${{ matrix.componentsCsv }})
    needs: plan-native
    if: needs.plan-native.outputs.enabled == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.jobTimeoutMinutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-native.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        if: startsWith(matrix.target, 'darwin-')
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Xcode
        if: startsWith(matrix.target, 'darwin-')
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.LYNX_XCODE_VERSION }}

      - name: Restore Lynx caches
        if: matrix.buildsLynxRuntime == true
        id: lynx-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.habitat_cache
            research/lynx/cache
          key: lynx-release-${{ matrix.target }}-xcode-${{ env.LYNX_XCODE_VERSION }}-ref-${{ env.LYNX_REF }}-${{ hashFiles('scripts/release/build-lynx-runtime.sh', 'scripts/release/lynx-macos.args.gn', 'scripts/release/lynx-mirrored-urls.txt', 'native/lynx-runtime-macos/**', 'native/lynx-patches/**') }}
          restore-keys: |
            lynx-release-${{ matrix.target }}-xcode-${{ env.LYNX_XCODE_VERSION }}-ref-${{ env.LYNX_REF }}-

      - name: Seed Googlesource hosts
        if: matrix.buildsLynxRuntime == true
        shell: bash
        run: |
          sudo python3 scripts/ci/seed_hosts_from_doh.py \
            flutter.googlesource.com \
            chromium.googlesource.com \
            fuchsia.googlesource.com \
            skia.googlesource.com \
            swiftshader.googlesource.com

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Build native artifacts
        shell: bash
        run: |
          set -euo pipefail
          bun run scripts/binaries/build-native-job.ts \
            --root "$PWD" \
            --target "${{ matrix.target }}" \
            --components "${{ matrix.componentsCsv }}" \
            --output-dir native-artifacts

      - name: Save Lynx caches
        if: matrix.buildsLynxRuntime == true && always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.habitat_cache
            research/lynx/cache
          key: ${{ steps.lynx-cache-restore.outputs.cache-primary-key }}

      - name: Upload Lynx build logs
        if: matrix.buildsLynxRuntime == true && always()
        uses: actions/upload-artifact@v4
        with:
          name: lynx-build-logs-${{ matrix.target }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            research/lynx/logs/**
            research/lynx/upstream/lynx/out/Default/args.gn
            research/lynx/upstream/lynx/out/Default/all.xcodeproj/project.pbxproj

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}
          path: native-artifacts/*
          if-no-files-found: error

  release:
    name: Release packages
    needs:
      - plan-native
      - native-artifacts
    if: ${{ always() && needs.plan-native.result == 'success' && needs.native-artifacts.result != 'failure' && needs.native-artifacts.result != 'cancelled' }}
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install npm with trusted publishing support
        run: npm install -g "npm@^11.10.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm run verify

      - name: Build publish artifacts
        run: pnpm run build

      - name: Detect pending changesets
        id: pending-changesets
        shell: bash
        run: |
          if find .changeset -maxdepth 1 -type f -name "*.md" ! -name "README.md" | grep -q .; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve release channel
        id: release-channel
        shell: bash
        run: |
          channel=stable
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.channel }}" == "alpha" ]]; then
            channel=alpha
          fi
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Version packages
        if: steps.pending-changesets.outputs.has_changesets == 'true' && steps.release-channel.outputs.channel == 'stable'
        run: pnpm run version-packages

      - name: Snapshot packages for alpha
        if: steps.pending-changesets.outputs.has_changesets == 'true' && steps.release-channel.outputs.channel == 'alpha'
        run: pnpm run version-packages:alpha

      - name: Commit version packages
        if: steps.pending-changesets.outputs.has_changesets == 'true' && steps.release-channel.outputs.channel == 'stable'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No version changes generated."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .changeset packages package.json pnpm-lock.yaml
          git commit -m "chore: version packages"
          git push

      - name: Download native artifacts
        if: needs.plan-native.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-artifacts

      - name: Stage native artifacts into npm packages
        if: needs.plan-native.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bun run scripts/binaries/stage-release-artifacts.ts \
            --root "$PWD" \
            --artifact-root native-artifacts \
            --stage-plan-json '${{ needs.plan-native.outputs.stage-plan }}'

      - name: Validate native package contents
        if: needs.plan-native.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bun run scripts/binaries/validate-package-dirs.ts \
            --package-dirs-json '${{ needs.plan-native.outputs.validate-package-dirs }}'

      - name: Publish packages
        if: needs.plan-native.outputs.publish-enabled == 'true' && steps.release-channel.outputs.channel == 'stable'
        run: pnpm run release

      - name: Publish alpha packages
        if: steps.pending-changesets.outputs.has_changesets == 'true' && steps.release-channel.outputs.channel == 'alpha'
        run: pnpm run release:alpha

      - name: Backfill release tags
        if: needs.plan-native.outputs.publish-enabled == 'true' && steps.release-channel.outputs.channel == 'stable'
        run: pnpm exec changeset tag

      - name: Push release tags
        if: needs.plan-native.outputs.publish-enabled == 'true' && steps.release-channel.outputs.channel == 'stable'
        run: git push origin --tags
