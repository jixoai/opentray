name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options:
          - stable
          - alpha
        default: stable

concurrency:
  # Include the source SHA so a jobless queued run cannot permanently block
  # later release attempts on the same branch after an Actions outage.
  group: release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  OPENTRAY_BUILD_IDENTITY: "github:${{ github.sha }}"

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  plan-native:
    name: Plan native release build
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      publish-enabled: ${{ steps.plan.outputs.publish-enabled }}
      matrix: ${{ steps.plan.outputs.matrix }}
      packed-consumer-enabled: ${{ steps.plan.outputs.packed-consumer-enabled }}
      packed-consumer-matrix: ${{ steps.plan.outputs.packed-consumer-matrix }}
      stage-plan: ${{ steps.plan.outputs.stage-plan }}
      validate-package-dirs: ${{ steps.plan.outputs.validate-package-dirs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Resolve native release plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          plan_json="$(bun run scripts/binaries/release-plan.ts --root "$PWD")"
          printf '%s\n' "$plan_json" > release-native-plan.json
          cat release-native-plan.json

          python3 - <<'PY'
          import json
          import os

          with open("release-native-plan.json", "r", encoding="utf-8") as handle:
              plan = json.load(handle)

          enabled = "true" if plan.get("enabled") else "false"
          publish_enabled = "true" if plan.get("publishEnabled") else "false"
          matrix = json.dumps({"include": plan.get("jobs", [])})
          packed_consumer_jobs = [
              job for job in plan.get("jobs", [])
              if "webview" in str(job.get("componentsCsv", "")).split(",")
          ]
          packed_consumer_enabled = "true" if packed_consumer_jobs else "false"
          packed_consumer_matrix = json.dumps({"include": packed_consumer_jobs})
          stage_plan = json.dumps(plan.get("stageEntries", []))
          validate_package_dirs = json.dumps(plan.get("validatePackageDirs", []))

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"enabled={enabled}\n")
              handle.write(f"publish-enabled={publish_enabled}\n")
              handle.write(f"matrix={matrix}\n")
              handle.write(f"packed-consumer-enabled={packed_consumer_enabled}\n")
              handle.write(f"packed-consumer-matrix={packed_consumer_matrix}\n")
              handle.write(f"stage-plan={stage_plan}\n")
              handle.write(f"validate-package-dirs={validate_package_dirs}\n")
          PY

  prepare-release:
    name: Prepare versioned release source
    needs: plan-native
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      has-changesets: ${{ steps.pending.outputs.has-changesets }}
      source-ref: ${{ steps.source.outputs.source-ref }}
      apply-patch: ${{ steps.source.outputs.apply-patch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release channel
        id: channel
        shell: bash
        run: |
          channel=stable
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.channel }}" == "alpha" ]]; then
            channel=alpha
          fi
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Detect pending changesets
        id: pending
        shell: bash
        run: |
          if find .changeset -maxdepth 1 -type f -name "*.md" ! -name "README.md" | grep -q .; then
            echo "has-changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-changesets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize release source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_ref="${{ github.sha }}"
          apply_patch=false

          if [[ "${{ steps.pending.outputs.has-changesets }}" == "true" ]]; then
            if [[ "${{ steps.channel.outputs.channel }}" == "alpha" ]]; then
              pnpm run version-packages:alpha
              git diff --binary -- . > release-source.patch
              apply_patch=true
            else
              pnpm run version-packages
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add .changeset packages package.json pnpm-lock.yaml
              git commit -m "chore: version packages"
              git push
              source_ref="$(git rev-parse HEAD)"
            fi
          fi

          echo "source-ref=${source_ref}" >> "$GITHUB_OUTPUT"
          echo "apply-patch=${apply_patch}" >> "$GITHUB_OUTPUT"

      - name: Upload alpha release source patch
        if: steps.source.outputs.apply-patch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-source-${{ github.run_id }}
          path: release-source.patch
          if-no-files-found: error

  native-artifacts:
    name: Native artifacts (${{ matrix.target }} / ${{ matrix.componentsCsv }})
    needs:
      - plan-native
      - prepare-release
    if: needs.plan-native.outputs.enabled == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.jobTimeoutMinutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-native.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.source-ref }}

      - name: Download alpha release source patch
        if: needs.prepare-release.outputs.apply-patch == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-source-${{ github.run_id }}
          path: release-source

      - name: Apply alpha release source patch
        if: needs.prepare-release.outputs.apply-patch == 'true'
        shell: bash
        run: git apply release-source/release-source.patch

      - name: Setup Node.js
        if: startsWith(matrix.target, 'darwin-')
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Build native artifacts
        shell: bash
        run: |
          set -euo pipefail
          bun run scripts/binaries/build-native-job.ts \
            --root "$PWD" \
            --target "${{ matrix.target }}" \
            --components "${{ matrix.componentsCsv }}" \
            --output-dir native-artifacts

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}
          path: native-artifacts/*
          if-no-files-found: error

  packed-consumer:
    name: Packed consumer (${{ matrix.target }})
    needs:
      - plan-native
      - prepare-release
      - native-artifacts
    if: ${{ needs.plan-native.outputs.packed-consumer-enabled == 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-native.outputs.packed-consumer-matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.source-ref }}

      - name: Download alpha release source patch
        if: needs.prepare-release.outputs.apply-patch == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-source-${{ github.run_id }}
          path: release-source

      - name: Apply alpha release source patch
        if: needs.prepare-release.outputs.apply-patch == 'true'
        shell: bash
        run: git apply release-source/release-source.patch

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publish artifacts
        run: pnpm run build

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-artifacts

      - name: Stage native artifacts into npm packages
        shell: bash
        run: |
          set -euo pipefail
          bun run scripts/binaries/stage-release-artifacts.ts \
            --root "$PWD" \
            --artifact-root native-artifacts \
            --stage-plan-json '${{ needs.plan-native.outputs.stage-plan }}'

      - name: Validate native package contents
        shell: bash
        run: |
          set -euo pipefail
          bun run scripts/binaries/validate-package-dirs.ts \
            --package-dirs-json '${{ needs.plan-native.outputs.validate-package-dirs }}'

      - name: Verify packed pnpm consumer
        run: pnpm run verify:packed-consumer -- --package-manager pnpm --target "${{ matrix.target }}"

      - name: Verify packed npm consumer
        run: pnpm run verify:packed-consumer -- --package-manager npm --target "${{ matrix.target }}"

  release:
    name: Release packages
    needs:
      - plan-native
      - prepare-release
      - native-artifacts
      - packed-consumer
    if: ${{ always() && needs.plan-native.result == 'success' && needs.prepare-release.result == 'success' && needs.native-artifacts.result != 'failure' && needs.native-artifacts.result != 'cancelled' && (needs.packed-consumer.result == 'success' || needs.packed-consumer.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.source-ref }}

      - name: Download alpha release source patch
        if: needs.prepare-release.outputs.apply-patch == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-source-${{ github.run_id }}
          path: release-source

      - name: Apply alpha release source patch
        if: needs.prepare-release.outputs.apply-patch == 'true'
        shell: bash
        run: git apply release-source/release-source.patch

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install npm with trusted publishing support
        run: npm install -g "npm@^11.10.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm run verify

      - name: Build publish artifacts
        run: pnpm run build

      - name: Download native artifacts
        if: needs.plan-native.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-artifacts

      - name: Stage native artifacts into npm packages
        if: needs.plan-native.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bun run scripts/binaries/stage-release-artifacts.ts \
            --root "$PWD" \
            --artifact-root native-artifacts \
            --stage-plan-json '${{ needs.plan-native.outputs.stage-plan }}'

      - name: Validate native package contents
        if: needs.plan-native.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bun run scripts/binaries/validate-package-dirs.ts \
            --package-dirs-json '${{ needs.plan-native.outputs.validate-package-dirs }}'

      - name: Publish packages
        if: needs.plan-native.outputs.publish-enabled == 'true' && needs.prepare-release.outputs.channel == 'stable'
        run: pnpm run release

      - name: Publish alpha packages
        if: needs.prepare-release.outputs.has-changesets == 'true' && needs.prepare-release.outputs.channel == 'alpha'
        run: pnpm run release:alpha

      - name: Backfill release tags
        if: needs.plan-native.outputs.publish-enabled == 'true' && needs.prepare-release.outputs.channel == 'stable'
        run: pnpm exec changeset tag

      - name: Push release tags
        if: needs.plan-native.outputs.publish-enabled == 'true' && needs.prepare-release.outputs.channel == 'stable'
        run: git push origin --tags
