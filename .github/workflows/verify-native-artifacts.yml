name: Verify Native Artifacts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/verify-native-artifacts.yml"
      - ".github/workflows/release.yml"
      - "crates/**"
      - "native/lynx-patches/**"
      - "native/lynx-runtime-macos/**"
      - "packages/**"
      - "scripts/binaries/**"
      - "scripts/ci/**"
      - "scripts/release/**"

concurrency:
  group: verify-native-artifacts-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  LYNX_REF: "3a936299ec1669cfd1f3da71e41240296bc226b3"
  LYNX_XCODE_VERSION: "16.4"

permissions:
  contents: read

jobs:
  native-artifacts:
    name: Native artifacts (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.job_timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
            job_timeout_minutes: 90
            lynx_timeout_seconds: 4500
            daemon_artifact: opentray
            webview_artifact: libopentray_ext_webview.dylib
            lynx_artifact: libopentray_ext_lynx.dylib
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            job_timeout_minutes: 90
            lynx_timeout_seconds: 4500
            daemon_artifact: opentray
          - target: linux-x64
            runner: ubuntu-24.04
            job_timeout_minutes: 90
            lynx_timeout_seconds: 4500
            daemon_artifact: opentray
          - target: windows-arm64
            runner: windows-11-arm
            job_timeout_minutes: 90
            lynx_timeout_seconds: 4500
            daemon_artifact: opentray.exe
            webview_artifact: opentray_ext_webview.dll
          - target: windows-x64
            runner: windows-2025
            job_timeout_minutes: 90
            lynx_timeout_seconds: 4500
            daemon_artifact: opentray.exe
            webview_artifact: opentray_ext_webview.dll
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        if: startsWith(matrix.target, 'darwin-')
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Xcode
        if: startsWith(matrix.target, 'darwin-')
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.LYNX_XCODE_VERSION }}

      - name: Restore Lynx caches
        if: startsWith(matrix.target, 'darwin-')
        id: lynx-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.habitat_cache
            research/lynx/cache
          key: lynx-release-${{ matrix.target }}-xcode-${{ env.LYNX_XCODE_VERSION }}-ref-${{ env.LYNX_REF }}-${{ hashFiles('scripts/release/build-lynx-runtime.sh', 'scripts/release/lynx-macos.args.gn', 'scripts/release/lynx-mirrored-urls.txt', 'native/lynx-runtime-macos/**', 'native/lynx-patches/**') }}
          restore-keys: |
            lynx-release-${{ matrix.target }}-xcode-${{ env.LYNX_XCODE_VERSION }}-ref-${{ env.LYNX_REF }}-

      - name: Seed Googlesource hosts
        if: startsWith(matrix.target, 'darwin-')
        shell: bash
        run: |
          sudo python3 scripts/ci/seed_hosts_from_doh.py \
            flutter.googlesource.com \
            chromium.googlesource.com \
            fuchsia.googlesource.com \
            skia.googlesource.com \
            swiftshader.googlesource.com

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2

      - name: Build Rust artifacts
        shell: bash
        run: |
          set -euo pipefail
          packages=(-p opentray-bin)
          if [[ "${{ matrix.target }}" != linux-* ]]; then
            packages+=(-p opentray-ext-webview)
          fi
          if [[ "${{ matrix.target }}" == darwin-* ]]; then
            packages+=(-p opentray-ext-lynx)
          fi
          cargo build --release "${packages[@]}"
          mkdir -p native-artifacts
          cp "target/release/${{ matrix.daemon_artifact }}" native-artifacts/
          if [[ "${{ matrix.target }}" != linux-* ]]; then
            cp "target/release/${{ matrix.webview_artifact }}" native-artifacts/
          fi
          if [[ "${{ matrix.target }}" == darwin-* ]]; then
            cp "target/release/${{ matrix.lynx_artifact }}" native-artifacts/
          fi

      - name: Build Lynx runtime sidecar
        if: startsWith(matrix.target, 'darwin-')
        shell: bash
        run: |
          python3 scripts/ci/run_with_watchdog.py \
            --label "lynx-runtime-${{ matrix.target }}" \
            --timeout-seconds "${{ matrix.lynx_timeout_seconds }}" \
            --heartbeat-seconds 60 \
            -- \
            bash scripts/release/build-lynx-runtime.sh "native-artifacts/OpenTrayLynxRuntime.app.zip"

      - name: Save Lynx caches
        if: startsWith(matrix.target, 'darwin-') && always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.habitat_cache
            research/lynx/cache
          key: ${{ steps.lynx-cache-restore.outputs.cache-primary-key }}

      - name: Upload Lynx build logs
        if: startsWith(matrix.target, 'darwin-') && always()
        uses: actions/upload-artifact@v4
        with:
          name: lynx-build-logs-${{ matrix.target }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            research/lynx/logs/**
            research/lynx/upstream/lynx/out/Default/args.gn
            research/lynx/upstream/lynx/out/Default/all.xcodeproj/project.pbxproj

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: native-artifacts/*
          if-no-files-found: error

  stage-and-pack:
    name: Stage and pack native npm packages
    needs: native-artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-artifacts

      - name: Stage native artifacts into npm packages
        shell: bash
        run: |
          set -euo pipefail
          for target in darwin-arm64 linux-arm64 linux-x64 windows-arm64 windows-x64; do
            package_os="${target%-*}"
            arch="${target##*-}"
            if [ "$package_os" = "windows" ]; then
              daemon_artifact="opentray.exe"
              webview_artifact="opentray_ext_webview.dll"
            elif [ "$package_os" = "darwin" ]; then
              daemon_artifact="opentray"
              webview_artifact="libopentray_ext_webview.dylib"
            else
              daemon_artifact="opentray"
            fi

            bun run scripts/binaries/stage-local.ts \
              --kind daemon \
              --source "native-artifacts/native-${target}/${daemon_artifact}" \
              --package-os "$package_os" \
              --arch "$arch"
            if [ "$package_os" != "linux" ]; then
              bun run scripts/binaries/stage-local.ts \
                --kind webview \
                --source "native-artifacts/native-${target}/${webview_artifact}" \
                --package-os "$package_os" \
                --arch "$arch"
            fi
            if [ "$package_os" = "darwin" ]; then
              bun run scripts/binaries/stage-local.ts \
                --kind lynx \
                --source "native-artifacts/native-${target}/libopentray_ext_lynx.dylib" \
                --package-os "$package_os" \
                --arch "$arch"
              bun run scripts/binaries/stage-local.ts \
                --kind lynx-runtime \
                --source "native-artifacts/native-${target}/OpenTrayLynxRuntime.app.zip" \
                --package-os "$package_os" \
                --arch "$arch"
            fi
          done

      - name: Validate native package contents
        shell: bash
        run: |
          set -euo pipefail
          for package_dir in \
            packages/cli \
            packages/darwin-arm64 packages/linux-arm64 packages/linux-x64 packages/windows-arm64 packages/windows-x64 \
            packages/ext-webview-darwin-arm64 packages/ext-webview-windows-arm64 packages/ext-webview-windows-x64 \
            packages/ext-lynx packages/ext-lynx-darwin-arm64
          do
            npm pack --dry-run --json "./${package_dir}" >/dev/null
          done
