name: Verify Native Artifacts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/verify-native-artifacts.yml"
      - ".github/workflows/release.yml"
      - "crates/**"
      - "native/lynx-patches/**"
      - "native/lynx-runtime-macos/**"
      - "packages/**"
      - "scripts/binaries/**"
      - "scripts/ci/**"
      - "scripts/release/**"

concurrency:
  group: verify-native-artifacts-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  LYNX_REF: "3a936299ec1669cfd1f3da71e41240296bc226b3"
  LYNX_XCODE_VERSION: "16.4"

permissions:
  contents: read

jobs:
  plan-native:
    name: Plan native verification build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      stage-plan: ${{ steps.plan.outputs.stage-plan }}
      validate-package-dirs: ${{ steps.plan.outputs.validate-package-dirs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Resolve native verification plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          plan_json="$(bun run scripts/binaries/verify-native-plan.ts)"
          printf '%s\n' "$plan_json" > verify-native-plan.json
          cat verify-native-plan.json

          python3 - <<'PY'
          import json
          import os

          with open("verify-native-plan.json", "r", encoding="utf-8") as handle:
              plan = json.load(handle)

          matrix = json.dumps({"include": plan.get("jobs", [])})
          stage_plan = json.dumps(plan.get("stageEntries", []))
          validate_package_dirs = json.dumps(plan.get("validatePackageDirs", []))

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"matrix={matrix}\n")
              handle.write(f"stage-plan={stage_plan}\n")
              handle.write(f"validate-package-dirs={validate_package_dirs}\n")
          PY

  native-artifacts:
    name: Native artifacts (${{ matrix.target }} / ${{ matrix.componentsCsv }})
    needs: plan-native
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.jobTimeoutMinutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-native.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        if: startsWith(matrix.target, 'darwin-')
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Xcode
        if: startsWith(matrix.target, 'darwin-')
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.LYNX_XCODE_VERSION }}

      - name: Restore Lynx caches
        if: matrix.buildsLynxRuntime == true
        id: lynx-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.habitat_cache
            research/lynx/cache
          key: lynx-release-${{ matrix.target }}-xcode-${{ env.LYNX_XCODE_VERSION }}-ref-${{ env.LYNX_REF }}-${{ hashFiles('scripts/release/build-lynx-runtime.sh', 'scripts/release/lynx-macos.args.gn', 'scripts/release/lynx-mirrored-urls.txt', 'native/lynx-runtime-macos/**', 'native/lynx-patches/**') }}
          restore-keys: |
            lynx-release-${{ matrix.target }}-xcode-${{ env.LYNX_XCODE_VERSION }}-ref-${{ env.LYNX_REF }}-

      - name: Seed Googlesource hosts
        if: matrix.buildsLynxRuntime == true
        shell: bash
        run: |
          sudo python3 scripts/ci/seed_hosts_from_doh.py \
            flutter.googlesource.com \
            chromium.googlesource.com \
            fuchsia.googlesource.com \
            skia.googlesource.com \
            swiftshader.googlesource.com

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Build native artifacts
        shell: bash
        run: |
          set -euo pipefail
          bun run scripts/binaries/build-native-job.ts \
            --root "$PWD" \
            --target "${{ matrix.target }}" \
            --components "${{ matrix.componentsCsv }}" \
            --output-dir native-artifacts

      - name: Save Lynx caches
        if: matrix.buildsLynxRuntime == true && always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.habitat_cache
            research/lynx/cache
          key: ${{ steps.lynx-cache-restore.outputs.cache-primary-key }}

      - name: Upload Lynx build logs
        if: matrix.buildsLynxRuntime == true && always()
        uses: actions/upload-artifact@v4
        with:
          name: lynx-build-logs-${{ matrix.target }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            research/lynx/logs/**
            research/lynx/upstream/lynx/out/Default/args.gn
            research/lynx/upstream/lynx/out/Default/all.xcodeproj/project.pbxproj

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}
          path: native-artifacts/*
          if-no-files-found: error

  stage-and-pack:
    name: Stage and pack native npm packages
    needs:
      - plan-native
      - native-artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-artifacts

      - name: Stage native artifacts into npm packages
        shell: bash
        run: |
          set -euo pipefail
          bun run scripts/binaries/stage-release-artifacts.ts \
            --root "$PWD" \
            --artifact-root native-artifacts \
            --stage-plan-json '${{ needs.plan-native.outputs.stage-plan }}'

      - name: Validate native package contents
        shell: bash
        run: |
          set -euo pipefail
          bun run scripts/binaries/validate-package-dirs.ts \
            --package-dirs-json '${{ needs.plan-native.outputs.validate-package-dirs }}'
